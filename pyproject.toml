[project]
name = "ask-yaron"
version = "0.1.0"
description = "Ask my CV: a grounded, evaluated question-answering agent over Yaron Lavi's CV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pyyaml>=6",
]

[project.optional-dependencies]
web = ["gradio>=5"]

[project.scripts]
ask-yaron = "ask_yaron:main"
ask-yaron-evals = "ask_yaron.evals:main"
ask-yaron-web = "ask_yaron.web:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
