<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask my CV: Yaron Lavi</title>
<meta name="description" content="Ask about Yaron Lavi's experience. Answers come only from his CV, with sources.">
<style>
:root { color-scheme: light dark; --bg: #f6f7f9; --panel: #fff; --line: #dfe2e8; --text: #171a21; --dim: #5f6675; --accent: #3a4fd0; --on-accent: #fff; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d0f14; --panel: #161922; --line: #2a2e3a; --text: #e9ebf0; --dim: #979eae; --accent: #8c9aff; --on-accent: #0d0f14; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 48px 20px; }
h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.01em; }
p.lead { margin: 0 0 24px; color: var(--dim); }
form { display: flex; gap: 8px; }
input { flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
button { font: inherit; cursor: pointer; border-radius: 10px; }
form button { padding: 12px 18px; color: var(--on-accent); background: var(--accent); border: 0; font-weight: 600; }
form button:disabled { opacity: .55; cursor: wait; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 28px; }
.examples button { padding: 6px 12px; color: var(--dim); background: none; border: 1px solid var(--line); font-size: 14px; }
.turn { padding: 16px 18px; margin-bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.q { margin: 0 0 8px; font-weight: 600; overflow-wrap: anywhere; }
.a { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.sources { margin: 10px 0 0; color: var(--dim); font-size: 13px; }
footer { margin-top: 32px; color: var(--dim); font-size: 14px; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Ask my CV</h1>
  <p class="lead">Ask about Yaron Lavi's experience. Answers come only from his CV and project notes, with sources. If something isn't covered, it says so instead of guessing.</p>
  <form id="form">
    <input id="question" maxlength="500" placeholder="Ask a question" aria-label="Your question" autocomplete="off" required>
    <button id="send" type="submit">Ask</button>
  </form>
  <div class="examples" id="examples"></div>
  <div id="log" aria-live="polite"></div>
  <footer>Answers are AI-generated and can be wrong; check with Yaron. <a href="https://linkedin.com/in/yaron-lavi">LinkedIn</a></footer>
</main>
<script>
const EXAMPLES = ["What has Yaron built with AI agents?", "What does he do at Certivity?", "What did he build at Vyzer?", "Which backend technologies does he use?"];
const form = document.getElementById("form"), input = document.getElementById("question"),
  send = document.getElementById("send"), log = document.getElementById("log");
function el(tag, cls, text) { const e = document.createElement(tag); e.className = cls; e.textContent = text; return e; }
for (const q of EXAMPLES) {
  const b = el("button", "", q); b.type = "button";
  b.onclick = () => { input.value = q; form.requestSubmit(); };
  document.getElementById("examples").append(b);
}
form.onsubmit = async (event) => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question || send.disabled) return;
  const turn = el("div", "turn", ""), a = el("p", "a", "Thinking...");
  turn.append(el("p", "q", question), a);
  log.prepend(turn);
  input.value = ""; send.disabled = true;
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    const data = await res.json();
    a.textContent = data.answer || (typeof data.error === "string" && data.error) || "Something went wrong. Please try again.";
    if (data.sources && data.sources.length) turn.append(el("p", "sources", "Sources: " + data.sources.join(" · ")));
  } catch { a.textContent = "Couldn't reach the demo. Please try again."; }
  send.disabled = false; input.focus();
};
</script>
</body>
</html>
